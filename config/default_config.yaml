# =======================================
# rocom-plugin 默认配置模板（随插件更新，请勿直接修改）
# 需要自定义请在同目录 config.yaml 中覆盖对应字段
# =======================================

# 群黑白名单
groupWhite: []
groupBlack: []

# 渲染缩放（百分比）：200 为两倍像素高清图，100 为原始尺寸
renderScale: 200

# ---------- 远行商人订阅 ----------
subscribe:
  # 总开关
  enable: false

  # 是否 @全体成员（无权限时自动降级为普通消息）
  atAll: true

  # 推送的群号
  groups: []

  # 订阅的关键词（模糊包含匹配，商品名/描述/标签任一命中即提醒）
  # 例：国王球 / 粉尘 / 稀有
  keywords: []

  # 开轮后延迟多少秒开始抓取（数据源按轮更新，立即抓可能还没有新货）
  delaySeconds: 120

  # 抓取重试次数与间隔
  retry: 5
  retryIntervalSeconds: 30

# ---------- 活动到期提醒 ----------
activityReminder:
  # 全局总开关；各群仍需单独开启
  enable: true

  # 已开启活动到期提醒的群号
  groups: []

  # 需要 @全体成员的群号；该名单不会自动开启群订阅
  atAllGroups: []

  # 到期前提醒阶段（小时），每个活动每阶段成功送达一次
  hoursBefore: [24, 6]

  # 活动缓存最大允许年龄（小时）
  cacheMaxAgeHours: 48
