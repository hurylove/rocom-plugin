<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "AlimamaFangYuan";
    src: url("{{fontUrl}}") format("truetype");
    font-weight: 100 900;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { -webkit-font-smoothing: antialiased; }
  body {
    width: 760px;
    transform: scale({{renderScale}});
    transform-origin: top left;
    padding: 28px;
    font-family: "AlimamaFangYuan", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #efe8da;
    color: #2b2823;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px 17px;
    border-bottom: 2px solid #d8cfbd;
    margin-bottom: 18px;
  }
  .title {
    font-size: 25px; font-weight: 700; color: #3a3428;
  }
  .title small {
    display: block; margin-top: 7px;
    font-size: 12px; font-weight: 400; color: #929086;
  }
  .badge {
    display: inline-block; padding: 4px 13px;
    border: 1px solid var(--season-accent-2);
    border-radius: 20px;
    font-size: 13px; font-weight: 700;
    color: var(--season-accent);
    background: #fbf7ef;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  .pet {
    min-width: 0;
    padding: 12px 10px 11px;
    background: #fbf7ef;
    border: 1px solid #e4dbc9;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(120,100,70,.06);
  }
  .pic {
    height: 108px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    border-radius: 9px;
    background: #f2ead9;
    border: 1px solid #e8ddc8;
  }
  .pic img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .name {
    margin-top: 9px;
    font-size: 14px; font-weight: 700; color: #332e25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta {
    display: flex; align-items: center; gap: 5px;
    margin-top: 6px;
    min-width: 0;
  }
  .number {
    color: #929086;
    font-size: 11px; font-variant-numeric: tabular-nums;
  }
  .type {
    padding: 1px 6px;
    border-radius: 5px;
    color: var(--season-accent);
    background: #f0e9dc;
    border: 1px solid #e6ddcc;
    font-size: 10px;
  }
  .footer {
    margin-top: 17px;
    padding: 0 3px;
    color: #a49b89;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body style="--season-accent: {{season.accent}}; --season-accent-2: {{season.accent2}}">
  <div class="header">
    <div class="title">{{season.id}} {{season.name}}
      <small>有异色 · 进化位置：初始</small>
    </div>
    <span class="badge">{{season.id}} {{season.name}}</span>
  </div>

  <div class="grid">
    {{each season.pets pet}}
    <div class="pet">
      <div class="pic">
        {{if pet.img}}<img src="{{pet.img}}" alt="{{pet.name}}">{{else}}<span>{{pet.name}}</span>{{/if}}
      </div>
      <div class="name">{{pet.name}}</div>
      <div class="meta">
        <span class="number">{{pet.number}}</span>
        {{each pet.types type}}<span class="type">{{type}}</span>{{/each}}
      </div>
    </div>
    {{/each}}
  </div>

  <div class="footer">数据来源：洛克王国世界 WIKI 精灵图鉴 · 共收录 {{season.pets.length}} 个初始异色形态</div>
</body>
</html>
