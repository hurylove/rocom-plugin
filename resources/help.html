<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "AlimamaFangYuan";
    src: url("{{fontUrl}}") format("truetype");
    font-weight: 100 900;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { -webkit-font-smoothing: antialiased; }
  body {
    width: 720px;
    transform: scale({{renderScale}});
    transform-origin: top left;
    padding: 30px 26px 26px;
    font-family: "AlimamaFangYuan", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #efe8da;
    color: #2b2823;
  }

  .header {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 2px 18px;
    border-bottom: 2px solid #d8cfbd;
    margin-bottom: 18px;
  }
  .title { font-size: 25px; font-weight: 700; letter-spacing: 1px; color: #3a3428; }
  .title small {
    display: block; font-size: 12px; font-weight: 400; color: #929086;
    margin-top: 7px; letter-spacing: .4px;
  }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 700; color: #7a5a20;
    background: #ffe6b0; border: 1px solid #f0c96a;
    padding: 3px 12px; border-radius: 20px;
  }

  .section { margin-bottom: 14px; }
  .section:last-of-type { margin-bottom: 0; }
  .sec-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; color: #7a5a20;
    margin: 0 2px 10px;
  }
  .sec-head::before {
    content: ""; width: 4px; height: 15px; border-radius: 2px;
    background: #f0c96a;
  }

  .items { display: flex; flex-direction: column; gap: 8px; }
  .item {
    padding: 11px 14px;
    background: #fbf7ef;
    border: 1px solid #e4dbc9;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.65;
    color: #5a5244;
  }
  .cmd {
    font-size: 13px; font-weight: 700; color: #b5532a;
    background: #fbe4d6; border: 1px solid #f2cdb8;
    padding: 1px 7px; border-radius: 5px;
    white-space: nowrap;
  }
  .strong { font-weight: 700; color: #8a6a1e; }

  .footer { margin-top: 16px; font-size: 12px; color: #a49b89; text-align: center; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">{{title}}
      <small>{{subtitle}}</small>
    </div>
    <span class="badge">共 {{sections.length}} 个分类</span>
  </div>

  {{each sections sec}}
  <div class="section">
    <div class="sec-head">{{sec.title}}</div>
    <div class="items">
      {{each sec.items line}}
      <div class="item">{{@line}}</div>
      {{/each}}
    </div>
  </div>
  {{/each}}

  <div class="footer">{{footer}}</div>
</body>
</html>
