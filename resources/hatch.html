<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "AlimamaFangYuan";
    src: url("{{fontUrl}}") format("truetype");
    font-weight: 100 900;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { -webkit-font-smoothing: antialiased; }
  body {
    width: 760px;
    transform: scale({{renderScale}});
    transform-origin: top left;
    padding: 28px;
    font-family: "AlimamaFangYuan", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #efe8da;
    color: #2b2823;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px 17px;
    border-bottom: 2px solid #d8cfbd;
    margin-bottom: 18px;
  }
  .title { font-size: 25px; font-weight: 700; color: #3a3428; }
  .title small { display: block; margin-top: 7px; font-size: 12px; font-weight: 400; color: #929086; }
  .egg {
    display: inline-block; padding: 6px 15px;
    border-radius: 20px; background: #fbf7ef; border: 1px solid #e4dbc9;
    color: #8a6a1e; font-size: 13px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .pet {
    min-width: 0;
    padding: 12px 10px 11px;
    background: #fbf7ef;
    border: 1px solid #e4dbc9;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(120,100,70,.06);
  }
  .pic { height: 96px; display: flex; align-items: center; justify-content: center; }
  .pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .rank {
    display: inline-block; margin-bottom: 6px;
    padding: 1px 7px; border-radius: 9px;
    background: #f3ead6; color: #a8873c;
    font-size: 10px; font-weight: 700;
  }
  .name {
    font-size: 14px; font-weight: 700; color: #332e25; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 35px;
  }
  .no { margin-top: 4px; color: #a49b89; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
  .prob { margin-top: 7px; color: #b4761f; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .range { margin-top: 5px; color: #8a8271; font-size: 10px; line-height: 1.45; font-variant-numeric: tabular-nums; }
  .footer { margin-top: 17px; padding: 0 3px; color: #a49b89; font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">孵蛋查询
      <small>洛克王国世界 · 按蛋体尺寸与重量反推</small>
    </div>
    <div class="egg">{{result.size}} m · {{result.weight}} kg</div>
  </div>

  <div class="grid">
    {{each result.cards item index}}
    <div class="pet">
      <div class="pic">{{if item.image}}<img src="{{item.image}}" alt="{{item.name}}">{{/if}}</div>
      <div class="rank">No.{{index + 1}}</div>
      <div class="name">{{item.name}}</div>
      <div class="no">{{item.number}}</div>
      <div class="prob">{{item.probText}}</div>
      <div class="range">尺寸 {{item.sizeRange}}<br>重量 {{item.weightRange}}</div>
    </div>
    {{/each}}
  </div>

  <div class="footer">rocom-plugin · 共 {{result.total}} 只可能孵化的精灵</div>
</body>
</html>
